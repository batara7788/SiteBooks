<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книги</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Roboto+Slab:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="shelf-page" data-font="slab" data-size="2" data-leading="normal">
  <div class="shelf-layout">
    <div class="shelf-main">
      <header class="shelf-header">
        <h1>Книги</h1>
        <p>Читайте прямо здесь — ничего скачивать не нужно.</p>
      </header>
      <main class="shelf-grid" id="shelf-grid"></main>
    </div>

    <aside class="panel right shelf-notes" id="shelf-notes-panel">
      <h3>Заметки</h3>
      <div id="shelf-notes-list"></div>
    </aside>
  </div>

  <button id="shelf-notes-toggle" class="shelf-notes-toggle">☰ Заметки</button>
  <div class="panel-overlay" id="shelf-panel-overlay"></div>

  <script>
    // Тема применяется до отрисовки полки, чтобы не было мигания светлым фоном.
    try {
      const raw = localStorage.getItem("reader-settings");
      const theme = raw ? JSON.parse(raw).theme : null;
      if (theme) document.body.dataset.theme = theme;
    } catch {}
  </script>
  <script src="assets/shelf.js"></script>
</body>
</html>
